name: "Build and Deploy Web to Itch.io"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: itch-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-and-deploy:
    name: Export Web Build and Upload to Itch.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch beehave addon
        run: |
          git clone --depth 1 --branch v2.9.3 https://github.com/bitbrain/beehave.git /tmp/beehave
          mkdir -p addons/beehave
          cp -r /tmp/beehave/addons/beehave/. addons/beehave/

      - name: Godot Web Export
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: "Web"
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Web Build
        env:
          WEB_BUILD_DIRECTORY: ${{ steps.export.outputs.build_directory }}/Web
        run: test -f "$WEB_BUILD_DIRECTORY/index.html"

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ steps.export.outputs.build_directory }}/Web

      - name: Set Up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Publish to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_USERNAME: ${{ vars.ITCHIO_USERNAME || secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ vars.ITCHIO_GAME || secrets.ITCHIO_GAME }}
          WEB_BUILD_DIRECTORY: ${{ steps.export.outputs.build_directory }}/Web
        run: |
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo "::error::BUTLER_API_KEY is not configured as a repository secret."
            exit 1
          fi
          if [[ -z "$ITCHIO_USERNAME" ]]; then
            echo "::error::ITCHIO_USERNAME is not configured as a repository variable or secret."
            exit 1
          fi
          if [[ -z "$ITCHIO_GAME" ]]; then
            echo "::error::ITCHIO_GAME is not configured as a repository variable or secret."
            exit 1
          fi
          if [[ "$ITCHIO_USERNAME" == *"/"* || "$ITCHIO_GAME" == *"/"* ]]; then
            echo "::error::Use only the itch.io username and game URL slug, not a URL or path."
            exit 1
          fi

          butler push "$WEB_BUILD_DIRECTORY" "$ITCHIO_USERNAME/$ITCHIO_GAME:web"
