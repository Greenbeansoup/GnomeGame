name: "Build Windows Executable"
on:
  push:
    branches:
      - main  # Triggers an artifact-only build whenever you push to main
    tags:
      - "v*"  # Push a tag like v0.1.0 to also publish a GitHub Release

jobs:
  build-windows:
    name: Export Windows Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create/update a release

    steps:
      # Step 1: Download your project files
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true # Ensures large art assets load correctly if using Git LFS

      # Step 2: Beehave is now committed under addons/beehave so teammates and CI use
      # the same addon files. The previous build-time vendor step is kept here as a
      # reference in case we decide to go back to fetching Beehave during export.
      # - name: Fetch beehave addon
      #   run: |
      #     git clone --depth 1 --branch v2.9.3 https://github.com/bitbrain/beehave.git /tmp/beehave
      #     mkdir -p addons/beehave
      #     cp -r /tmp/beehave/addons/beehave/. addons/beehave/

      # Step 3: Download Godot 4.7 and match export templates
      - name: Godot Windows Export
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          # The Linux engine build to run the export (Godot 4.7 no longer ships
          # a separate "headless" build, this one runs headless via CLI flags)
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          # Match this exactly to the preset name in your Godot Editor
          export_preset_name: "Windows Desktop"
          archive_output: true
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Make the build downloadable from the Actions run (every push)
      # Uses the unarchived build_directory since upload-artifact zips it itself,
      # avoiding a zip-in-a-zip that archive_directory would produce.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.export.outputs.build_directory }}

      # Step 5: Attach the build to a GitHub Release (only when a tag is pushed)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
