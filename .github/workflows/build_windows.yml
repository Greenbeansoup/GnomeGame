name: "Build Windows Executable"
on:
  push:
    branches:
      - main  # Triggers an artifact-only build whenever you push to main
    tags:
      - "v*"  # Push a tag like v0.1.0 to also publish a GitHub Release

jobs:
  build-windows:
    name: Export Windows Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create/update a release

    steps:
      # Step 1: Download your project files
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true # Ensures large art assets load correctly if using Git LFS

      # Step 2: Beehave is not committed to the repo. CI vendors a known version
      # directly from GitHub so export builds have the addon without requiring
      # every developer's local Beehave install to match the build host.
      - name: Fetch beehave addon
        run: |
          git clone --depth 1 --branch v2.9.3 https://github.com/bitbrain/beehave.git /tmp/beehave
          mkdir -p addons/beehave
          cp -r /tmp/beehave/addons/beehave/. addons/beehave/

      # Step 3: Download Godot 4.7 and match export templates
      - name: Godot Windows Export
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          # The Linux engine build to run the export (Godot 4.7 no longer ships
          # a separate "headless" build, this one runs headless via CLI flags)
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          # Match this exactly to the preset name in your Godot Editor
          presets_to_export: "Windows Desktop"
          archive_output: true
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Make the build downloadable from the Actions run (every push)
      # Uses the unarchived build_directory since upload-artifact zips it itself,
      # avoiding a zip-in-a-zip that archive_directory would produce.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.export.outputs.build_directory }}

      - name: Verify Windows Build
        env:
          WINDOWS_BUILD_DIRECTORY: ${{ steps.export.outputs.build_directory }}/Windows Desktop
        run: test -f "$WINDOWS_BUILD_DIRECTORY/gnome_platformer_demo_v0.03.exe"

      - name: Set Up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Publish Windows Build to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_USERNAME: ${{ vars.ITCHIO_USERNAME || secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ vars.ITCHIO_GAME || secrets.ITCHIO_GAME }}
          WINDOWS_BUILD_DIRECTORY: ${{ steps.export.outputs.build_directory }}/Windows Desktop
        run: |
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo "::error::BUTLER_API_KEY is not configured as a repository secret."
            exit 1
          fi
          if [[ -z "$ITCHIO_USERNAME" ]]; then
            echo "::error::ITCHIO_USERNAME is not configured as a repository variable or secret."
            exit 1
          fi
          if [[ -z "$ITCHIO_GAME" ]]; then
            echo "::error::ITCHIO_GAME is not configured as a repository variable or secret."
            exit 1
          fi
          if [[ "$ITCHIO_USERNAME" == *"/"* || "$ITCHIO_GAME" == *"/"* ]]; then
            echo "::error::Use only the itch.io username and game URL slug, not a URL or path."
            exit 1
          fi

          itch_projects=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $BUTLER_API_KEY" \
            https://api.itch.io/profile/games)
          itch_target="$ITCHIO_USERNAME.itch.io/$ITCHIO_GAME"
          if ! jq --exit-status --arg target "$itch_target" '
            (.games // []) | any(.[];
              (.url | sub("^https?://"; "") | ascii_downcase) == ($target | ascii_downcase)
            )
          ' <<<"$itch_projects" > /dev/null; then
            echo "::error::The configured itch.io project is not accessible to this API key. Verify its URL slug and ensure the key belongs to its owner or an editor."
            exit 1
          fi

          butler push "$WINDOWS_BUILD_DIRECTORY" "$ITCHIO_USERNAME/$ITCHIO_GAME:windows"

      # Attach the build to a GitHub Release (only when a tag is pushed)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
